        .ep-btn { 
            background: #ff9800; color: white; padding: 10px 20px; text-decoration: none;

        }
        .ep-btn:hover { background: #e68a00; }

                };
            </script>
            <script src="https://mausoleumpoetrywrench.com/fdebd9fd35a0bc0d79229196e7e4fe57/invoke.js"></script>
        </div>
    </div>

    <!-- ZAROORI CHANGE 1: Database files ko upar load karna taaki main script unhe padh sake -->
    <script src="script.js"></script>     
    
    <!-- YAHAN FIX KIYA: web-series.js ki jagah webseries.js (Sahi file name) -->
    <script src="webseries.js"></script>  

    <script>
        // ZAROORI CHANGE 2: 'anime' ki jagah 'id' use karna
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id') || urlParams.get('anime'); // Backup ke liye anime bhi rakha hai
        const userType = urlParams.get('type'); 

        const titleEl = document.getElementById('pageTitle');
        const modeEl = document.getElementById('modeText');
        
        if(videoId && userType) {
            // ZAROORI CHANGE 3: SMART TITLE LOGIC YAHAN HAI
            let video = null;
            
            // Check in Anime DB
            if (typeof videoDB !== 'undefined') {
                video = videoDB.find(v => v.id === videoId); 
            }
            
            // If not found in Anime, Check in Web Series DB
            if (!video && typeof webSeriesDB !== 'undefined') {
                video = webSeriesDB.find(v => v.id === videoId); 
            }

            // Agar title mil gaya toh asli naam dikhao
            if (video) {
                titleEl.innerText = `Select Episode for ${video.title}`;
            } else {
                // Nahi mila toh ID (jaise JUJUTSU_KAISEN) dikhao
                titleEl.innerText = `Select Episode for ${videoId.toUpperCase().replace(/_/g, ' ')}`; 
            }

            modeEl.innerText = userType === 'download' ? 'Mode: Fast Server (Download)' : 'Mode: Watch Live (Stream)';
            
            // URL se episodes ki counting lo, varna 12 man lo
            const totalEpisodes = parseInt(urlParams.get('episodes')) || 12; 
            const container = document.getElementById('episodeContainer');

            // Generate buttons for each episode
            for (let i = 1; i <= totalEpisodes; i++) {
                const btn = document.createElement('button');
                btn.innerText = `EP ${i}`;
                btn.className = `ep-btn ${userType === 'stream' ? 'stream-mode' : ''}`;
                
                // ZAROORI CHANGE 4: Bridge page par ab 'id' forward hoga (taaki aage ke page pe title aaye)
                btn.onclick = function() {
                    window.location.href = `bridge.html?id=${videoId}&ep=${i}&type=${userType}`;
                };
                
                container.appendChild(btn);
            }
        } else {
            titleEl.innerText = "Error: Video Not Found!";
            modeEl.innerText = "Please go back to the homepage and select an anime or web series.";
        }
    </script>
