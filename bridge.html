<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Wait... - AnimeBanda</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .bridge-container { max-width: 600px; margin: 40px auto; text-align: center; background: #1a1a1a; padding: 30px; border-radius: 10px; color: white; }
        .timer-text { font-size: 20px; font-weight: bold; color: #ff9800; margin: 20px 0; }
        .continue-btn { background: #28a745; color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .continue-btn:hover { background: #218838; }
        .ad-space { margin: 20px 0; padding: 10px; min-height: 50px; background: #222; } 
        .spacer { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; } 
    </style>
</head>
<body>
    
    <div class="bridge-container">
        <h2 id="bridgeTitle">Verifying Link...</h2>
        
        <!-- Native Banner Ad -->
        <div class="ad-space"><script async="async" data-cfasync="false" src="https://mausoleumpoetrywrench.com/83d49701eaeb6fa7a2cc25d20b3a43d5/invoke.js"></script>
<div id="container-83d49701eaeb6fa7a2cc25d20b3a43d5"></div></div>

        <div class="timer-text" id="timer">Please wait <span id="timeCount">5</span> seconds...</div>
        
        <!-- Pehla Button (Timer ke baad aayega) -->
        <button class="continue-btn" id="verifyBtn" style="display: none;" onclick="verifyStep1()">Verify & Continue ➡️</button>

        <!-- Banner Ad -->
        <div class="ad-space"><script>
  atOptions = {
    'key' : 'fdebd9fd35a0bc0d79229196e7e4fe57',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://mausoleumpoetrywrench.com/fdebd9fd35a0bc0d79229196e7e4fe57/invoke.js"></script></div>
    </div>

    <!-- Scroll karwane ke liye lamba gap aur Dusra Button -->
    <div class="spacer" id="step2Container" style="display: none; flex-direction: column; justify-content: space-evenly; align-items: center; min-height: 100vh;">
        
        <div style="margin: 20px 0; width: 100%; text-align: center;">
             <script>
  atOptions = {
    'key' : '19a91b4780e465d335fa7eac1d53d033',
    'format' : 'iframe',
    'height' : 250,
    'width' : 300,
    'params' : {}
  };
</script>
<script src="https://mausoleumpoetrywrench.com/19a91b4780e465d335fa7eac1d53d033/invoke.js"></script>
        </div>

        <!-- Niche Wala Section -->
        <div style="width: 100%; text-align: center;">
            <div class="ad-space" style="margin-bottom: 15px;">
                 <script>
  atOptions = {
    'key' : 'fdebd9fd35a0bc0d79229196e7e4fe57',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://mausoleumpoetrywrench.com/fdebd9fd35a0bc0d79229196e7e4fe57/invoke.js"></script>
            </div>
            
            <button class="continue-btn" style="max-width: 600px; background: #007bff;" onclick="goToFinalPage()">Click Here to Continue ➡️</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        // ZAROORI CHANGE 1: 'anime' ki jagah 'id' dhoondhna hai taaki Anime + Web Series dono chalein
        const videoId = urlParams.get('id') || urlParams.get('anime'); // Fallback 'anime' just in case
        const epNum = urlParams.get('ep');
        const userType = urlParams.get('type');

        if(epNum) document.getElementById('bridgeTitle').innerText = `Preparing Episode ${epNum}`;

        let timeLeft = 5;
        const timerEl = document.getElementById('timeCount');
        const timerText = document.getElementById('timer');
        const verifyBtn = document.getElementById('verifyBtn');

        const countdown = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerText.style.display = "none";
                verifyBtn.style.display = "block";
            }
        }, 1000);

        let smartlinkOpened = false;

        function verifyStep1() {
            // 1-Time Smartlink Logic
            if (!smartlinkOpened) {
                window.open('https://mausoleumpoetrywrench.com/v41vpmfjek?key=919855f141d098f06c83a0b64cd7e643', '_blank');
                smartlinkOpened = true;
            }
            
            // Niche wala section show karo aur wahan scroll karo
            const step2 = document.getElementById('step2Container');
            step2.style.display = 'flex';
            step2.scrollIntoView({ behavior: 'smooth' });
            
            // Button ka text change kar do taaki user dobara na dabaye
            verifyBtn.innerText = "Scroll Down 👇";
            verifyBtn.style.background = "#555";
        }

        function goToFinalPage() {
            // ZAROORI CHANGE 2: Final page par ab ?id bhejenge, ?anime nahi
            window.open(`final-links.html?id=${videoId}&ep=${epNum}&type=${userType}`, '_blank');
        }
    </script>
    <script src="https://mausoleumpoetrywrench.com/d9/e8/88/d9e888d9286688250c2d311ade158943.js"></script>
</body>
</html>
